<body>

<div id="app"></div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const API = 'https://panel1-18e1d76be41d.herokuapp.com';

const TOKEN_KEY = 'zx_panel_token';
const SCOPE_KEY = TOKEN_KEY + '_scope';

const ADMIN_USERNAME = 'admin';

const app = document.getElementById('app');

let batchCache = [];


/* =========================================================
   HELPERS
========================================================= */

function esc(value) {
  return String(value == null ? '' : value).replace(
    /[&<>"']/g,
    function(c) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[c];
    }
  );
}


function getToken() {
  try {
    return localStorage.getItem(TOKEN_KEY) || '';
  } catch (e) {
    return '';
  }
}


function setToken(token) {
  try {
    if (token) {
      localStorage.setItem(TOKEN_KEY, token);
    } else {
      localStorage.removeItem(TOKEN_KEY);
    }
  } catch (e) {}
}


function getScope() {
  try {
    return localStorage.getItem(SCOPE_KEY) || '';
  } catch (e) {
    return '';
  }
}


function setScope(scope) {
  try {
    localStorage.setItem(SCOPE_KEY, scope || '');
  } catch (e) {}
}


function logout() {
  setToken('');
  setScope('');
  batchCache = [];
  showLogin();
}


function batchId(batch) {
  return String(
    batch &&
    (
      batch._id ||
      batch.id ||
      batch.batchId ||
      batch._id?.toString?.()
    ) || ''
  );
}


function batchName(batch) {
  return (
    batch?.name ||
    batch?.title ||
    batch?.batchName ||
    batch?.batch?.name ||
    'Untitled batch'
  );
}


function batchStatus(batch) {
  return batch?.status || 'Paid';
}


/* =========================================================
   API
========================================================= */

async function api(path, method = 'GET', body) {

  const headers = {};

  const token = getToken();

  if (token) {
    headers.Authorization = 'Bearer ' + token;
  }

  if (body !== undefined) {
    headers['Content-Type'] = 'application/json';
  }

  let response;

  try {

    response = await fetch(API + path, {
      method: method,
      headers: headers,
      body: body !== undefined
        ? JSON.stringify(body)
        : undefined
    });

  } catch (error) {

    throw new Error(
      'Cannot connect to server.\n\n' +
      'Backend: ' + API
    );
  }


  if (response.status === 401) {
    logout();
    throw new Error('Session expired. Please login again.');
  }


  const data = await response.json().catch(function() {
    return {};
  });


  if (!response.ok) {

    throw new Error(
      data.message ||
      data.error ||
      ('Request failed (' + response.status + ')')
    );
  }


  if (data.success === false) {

    throw new Error(
      data.message ||
      data.error ||
      'Request failed'
    );
  }


  return data;
}


/* =========================================================
   LOGIN
========================================================= */

function showLogin() {

  document.body.className = '';

  document.title = 'Test Uploader - Login';


  app.innerHTML = `
    <div class="login-wrap">

      <div class="card">

        <h1>Test Uploader Login</h1>

        <label for="tok">
          Auth Token
        </label>

        <input
          id="tok"
          type="password"
          placeholder="Enter your auth token"
          autocomplete="off"
        >

        <label for="role">
          Role
        </label>

        <select id="role">
          <option value="Batch Uploader">
            Batch Uploader
          </option>

          <option value="Test Series Uploader">
            Test Series Uploader
          </option>

          <option value="Admin">
            Admin
          </option>
        </select>

        <div id="adminBox" style="display:none">

          <label for="pw">
            Admin Password
          </label>

          <input
            id="pw"
            type="password"
            placeholder="Enter admin password"
            autocomplete="off"
          >

        </div>

        <button class="btn-main" id="go">
          Login
        </button>

        <div class="error" id="err"></div>

      </div>

    </div>
  `;


  const role = document.getElementById('role');
  const adminBox = document.getElementById('adminBox');
  const tokenInput = document.getElementById('tok');
  const passwordInput = document.getElementById('pw');
  const button = document.getElementById('go');
  const error = document.getElementById('err');


  role.onchange = function() {

    adminBox.style.display =
      role.value === 'Admin'
        ? 'block'
        : 'none';

  };


  async function submit() {

    error.textContent = '';

    const token = tokenInput.value.trim();
    const password = passwordInput.value;

    const isAdmin =
      role.value === 'Admin';


    let body;


    if (isAdmin && password && !token) {

      body = {
        username: ADMIN_USERNAME,
        password: password
      };

    } else if (token) {

      body = {
        authToken: token
      };

    } else {

      error.textContent =
        'Enter your auth token.';

      return;
    }


    button.disabled = true;
    button.textContent = 'Logging in...';


    try {

      const response = await fetch(
        API + '/api/auth/login',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        }
      );


      const data =
        await response.json().catch(function() {
          return {};
        });


      if (!response.ok || !data.token) {

        throw new Error(
          data.message ||
          data.error ||
          'Login failed'
        );
      }


      setToken(data.token);
      setScope(data.scope || '');


      showHome();

    } catch (e) {

      error.textContent =
        e.message === 'Failed to fetch'
          ? 'Cannot reach the server. Check your connection.'
          : e.message;

    } finally {

      button.disabled = false;
      button.textContent = 'Login';

    }

  }


  button.onclick = submit;


  tokenInput.onkeydown = function(e) {

    if (e.key === 'Enter') {
      submit();
    }

  };

}


/* =========================================================
   HOME
========================================================= */

function showHome() {

  document.body.className = 'home';

  document.title = 'Test Series Uploader';


  app.innerHTML = `
    <div class="page">

      <div class="bar">
        <div></div>

        <div class="right">
          <button
            class="btn-logout"
            id="lo"
          >
            Logout
          </button>
        </div>
      </div>


      <div class="home-head">

        <h1>
          Test Series Uploader
        </h1>

        <p>
          Upload and manage your test series content
        </p>

      </div>


      <div class="tiles">

        <button
          class="tile blue"
          id="t1"
        >
          <div class="icon">
            &#128196;
          </div>

          <h3>
            Tests
          </h3>

          <p>
            View source tests
          </p>
        </button>


        <button
          class="tile green"
          id="t2"
        >
          <div class="icon">
            &#128214;
          </div>

          <h3>
            DPPs
          </h3>

          <p>
            View source DPPs
          </p>
        </button>


        ${
          getScope() === 'all'
            ? `
              <button
                class="tile slate"
                id="t3"
              >
                <div class="icon">
                  &#9881;
                </div>

                <h3>
                  Admin
                </h3>

                <p>
                  Manage batches and tokens
                </p>
              </button>
            `
            : ''
        }

      </div>

    </div>
  `;


  document.getElementById('lo').onclick = logout;


  document.getElementById('t1').onclick =
    function() {
      showBatches('tests');
    };


  document.getElementById('t2').onclick =
    function() {
      showBatches('dpps');
    };


  const adminButton =
    document.getElementById('t3');


  if (adminButton) {

    adminButton.onclick =
      showAdmin;

  }

}


/* =========================================================
   SOURCE BATCHES
========================================================= */

async function showBatches(mode) {

  document.body.className = '';

  document.title =
    mode === 'dpps'
      ? 'Test Uploader - DPP Batches'
      : 'Test Uploader - Test Batches';


  app.innerHTML = `
    <div class="page">

      <div class="bar">

        <h2>
          Source Batches
        </h2>

        <div class="right">

          <button
            class="btn-back"
            id="bk"
          >
            Back
          </button>

          <button
            class="btn-logout"
            id="lo"
          >
            Logout
          </button>

        </div>

      </div>


      <input
        class="search"
        id="q"
        placeholder="Search batch..."
      >


      <div id="list">

        <div class="note">
          Loading source batches...
        </div>

      </div>

    </div>
  `;


  document.getElementById('bk').onclick =
    showHome;

  document.getElementById('lo').onclick =
    logout;


  const list =
    document.getElementById('list');

  const search =
    document.getElementById('q');


  function draw(filter) {

    const text =
      String(filter || '').toLowerCase();


    const rows =
      batchCache.filter(function(batch) {

        return batchName(batch)
          .toLowerCase()
          .includes(text);

      });


    if (!rows.length) {

      list.innerHTML = `
        <div class="note">
          No batches found for this token.
        </div>
      `;

      return;
    }


    list.innerHTML =
      rows.map(function(batch) {

        const id =
          batchId(batch);

        return `
          <div class="item">

            <div>

              <div class="name">
                ${esc(batchName(batch))}
              </div>

              <div class="sub">
                ${
                  esc(
                    batch.exam ||
                    batch.category ||
                    batchStatus(batch)
                  )
                }

                ${
                  batch.language
                    ? ' · ' + esc(batch.language)
                    : ''
                }
              </div>

            </div>


            <button
              class="btn-view"
              data-id="${esc(id)}"
            >
              View ${
                mode === 'dpps'
                  ? 'DPPs'
                  : 'Tests'
              }
            </button>

          </div>
        `;

      }).join('');


    list
      .querySelectorAll('[data-id]')
      .forEach(function(button) {

        button.onclick = function() {

          const selected =
            batchCache.find(function(batch) {

              return batchId(batch) ===
                button.dataset.id;

            });


          if (!selected) {

            alert(
              'Batch information not found.'
            );

            return;
          }


          showContent(
            selected,
            mode
          );

        };

      });

  }


  try {

    /*
      IMPORTANT:
      This is the SOURCE batch endpoint,
      not /api/admin/batches
    */

    const data =
      await api(
        '/api/admin/source/batches'
      );


    batchCache =
      Array.isArray(data.batches)
        ? data.batches
        : Array.isArray(data.items)
          ? data.items
          : Array.isArray(data.data)
            ? data.data
            : [];


    if (!batchCache.length) {

      list.innerHTML = `
        <div class="note">
          No source batches found for this token.
        </div>
      `;

      return;
    }


    search.oninput =
      function() {
        draw(search.value);
      };


    draw('');

  } catch (e) {

    list.innerHTML = `
      <div class="error-box">
        ${esc(e.message)}
      </div>
    `;

  }

}


/* =========================================================
   SOURCE TESTS / DPPS
========================================================= */

async function showContent(batch, mode) {

  const label =
    mode === 'dpps'
      ? 'DPPs'
      : 'Tests';

  const type =
    mode === 'dpps'
      ? 'dpps'
      : 'tests';


  document.title =
    'Test Uploader - ' + label;


  app.innerHTML = `
    <div class="page">

      <div class="bar">

        <h2>
          ${esc(batchName(batch))}
        </h2>

        <div class="right">

          <button
            class="btn-back"
            id="bk"
          >
            Back
          </button>

          <button
            class="btn-logout"
            id="lo"
          >
            Logout
          </button>

        </div>

      </div>


      <div id="list">

        <div class="note">
          Loading ${label.toLowerCase()}...
        </div>

      </div>

    </div>
  `;


  document.getElementById('bk').onclick =
    function() {
      showBatches(mode);
    };


  document.getElementById('lo').onclick =
    logout;


  const list =
    document.getElementById('list');


  const sourceBatchId =
    batchId(batch);


  if (!sourceBatchId) {

    list.innerHTML = `
      <div class="error-box">
        Batch ID is missing.
      </div>
    `;

    return;
  }


  try {

    /*
      SOURCE ENDPOINT

      /tests
      or
      /dpps
    */

    const data =
      await api(
        '/api/admin/source/batches/' +
        encodeURIComponent(sourceBatchId) +
        '/' +
        type
      );


    const items =
      Array.isArray(data.items)
        ? data.items
        : Array.isArray(data.tests)
          ? data.tests
          : Array.isArray(data.dpps)
            ? data.dpps
            : Array.isArray(data.data)
              ? data.data
              : [];


    if (!items.length) {

      list.innerHTML = `
        <div class="note">
          No source ${label.toLowerCase()}
          found in this batch.
        </div>
      `;

      return;
    }


    list.innerHTML =
      items.map(function(item) {

        const id =
          item._id ||
          item.id ||
          item.testId ||
          item.test_id ||
          '';


        const title =
          item.title ||
          item.name ||
          item.testName ||
          'Untitled';


        const questions =
          item.totalQuestions ||
          item.questionCount ||
          item.totalQuestion ||
          item.questions?.length ||
          0;


        return `
          <div class="item">

            <div>

              <div class="name">
                ${esc(title)}
              </div>

              <div class="sub">
                ${esc(questions)}
                questions

                ${
                  item.startTime
                    ? ' · ' +
                      esc(
                        new Date(
                          item.startTime
                        ).toLocaleString()
                      )
                    : ''
                }

              </div>

            </div>


            <div class="actions">

              <button
                class="btn-view"
                data-source-id="${esc(id)}"
              >
                View
              </button>

            </div>

          </div>
        `;

      }).join('');


    list
      .querySelectorAll('[data-source-id]')
      .forEach(function(button) {

        button.onclick =
          function() {

            const id =
              button.dataset.sourceId;


            if (!id) {

              alert(
                'Source test ID is missing.'
              );

              return;
            }


            showSourceDetails(
              id
            );

          };

      });


  } catch (e) {

    list.innerHTML = `
      <div class="error-box">
        ${esc(e.message)}
      </div>
    `;

  }

}


/* =========================================================

========================================================= */

async function showSourceDetails(testId) {

  document.title =

  app.innerHTML = `

        <h2>
          Test Details
        </h2>

        <div class="right">

          <button
            class="btn-back"

          >
            Back
          </button>

          <button
            class="btn-logout"
            id="lo"
          >
            Logout
          </button>

        </div>

      </div>


      <div id="details">

        <div class="note">
          Loading test details...
        </div>

      </div>

    </div>
  `;


  document.getElementById('lo').onclick =
    logout;


  document.getElementById('bk').onclick =
    function() {
      history.back();
    };


  const details =
    document.getElementById('details');


  try {

    const data =
      await api(
        '/api/admin/source/tests/' +
        encodeURIComponent(testId)
      );


    const test =
      data.test ||
      data.item ||
      data.data ||
      data;


    const title =
      test.title ||
      test.name ||
      'Untitled Test';


    const questions =
      Array.isArray(test.questions)
        ? test.questions
        : [];


    let questionsHtml =
      '';


    if (questions.length) {

      questionsHtml =
        questions.map(
          function(question, index) {

            return `
              <div class="section">

                <h3>
                  Question ${index + 1}
                </h3>

                <div>
                  ${
                    esc(
                      question.question ||
                      question.text ||
                      question.title ||
                      'Question'
                    )
                  }
                </div>

              </div>
            `;

          }
        ).join('');

    } else {

      questionsHtml = `
        <div class="note">
          Question data is not available
          in this response.
        </div>
      `;

    }


    details.innerHTML = `

      <div class="section">

        <h3>
          ${esc(title)}
        </h3>

        <div class="msg">
          Test ID:
          ${esc(testId)}
        </div>

        <div class="msg">
          Total Questions:
          ${esc(
            test.totalQuestions ||
            test.questionCount ||
            questions.length ||
            0
          )}
        </div>

      </div>

      ${questionsHtml}

    `;

  } catch (e) {

    details.innerHTML = `
      <div class="error-box">
        ${esc(e.message)}
      </div>
    `;

  }

}


/* =========================================================
   ADMIN PANEL
========================================================= */

async function showAdmin() {

  document.body.className = '';

  document.title =
    'Test Uploader - Admin';


  app.innerHTML = `
    <div class="page">

      <div class="bar">

        <h2>
          Admin
        </h2>

        <div class="right">

          <button
            class="btn-back"
            id="bk"
          >
            Back
          </button>

          <button
            class="btn-logout"
            id="lo"
          >
            Logout
          </button>

        </div>

      </div>


      <div class="section">

        <h3>
          Add Batch
        </h3>

        <div class="row">

          <input
            id="bn"
            placeholder="Batch name"
          >

          <select id="bs">
            <option>Paid</option>
            <option>Unpaid</option>
          </select>

          <button
            class="btn-view"
            id="ba"
          >
            Add Batch
          </button>

        </div>

        <div
          class="msg"
          id="bmsg"
        ></div>

      </div>


      <div class="section">

        <h3>
          Create Token
        </h3>

        <div class="msg">
          Choose the batches this token can open.
        </div>

        <div class="row">

          <input
            id="tn"
            placeholder="Token name"
          >

        </div>

        <div
          class="checks"
          id="checks"
        ></div>

        <div class="row">

          <button
            class="btn-view"
            id="tc"
          >
            Create Token
          </button>

        </div>

        <div
          class="msg"
          id="tmsg"
        ></div>

        <div id="tbox"></div>

      </div>


      <div class="section">

        <h3>
          Tokens
        </h3>

        <div id="tokens">
          <div class="note">
            Loading...
          </div>
        </div>

      </div>


      <div class="section">

        <h3>
          Batches
        </h3>

        <div id="batches">
          <div class="note">
            Loading...
          </div>
        </div>

      </div>

    </div>
  `;


  document.getElementById('bk').onclick =
    showHome;

  document.getElementById('lo').onclick =
    logout;


  const bmsg =
    document.getElementById('bmsg');

  const tmsg =
    document.getElementById('tmsg');


  async function refresh() {

    try {

      const result =
        await Promise.all([
          api('/api/admin/batches'),
          api('/api/admin/uploader-tokens')
        ]);


      const batches =
        result[0].batches || [];

      const tokens =
        result[1].tokens || [];


      document.getElementById(
        'checks'
      ).innerHTML = batches.length

        ? batches.map(function(batch) {

            return `
              <label>

                <input
                  type="checkbox"
                  value="${esc(batchId(batch))}"
                >

                ${esc(batchName(batch))}

              </label>
            `;

          }).join('')

        : `
          <div class="note">
            Add a batch first.
          </div>
        `;


      document.getElementById(
        'tokens'
      ).innerHTML = tokens.length

        ? tokens.map(function(token) {

            return `
              <div class="item">

                <div>

                  <div class="name">
                    ${esc(token.name)}
                  </div>

                  <div class="sub">
                    ${
                      token.active
                        ? 'Active'
                        : 'Revoked'
                    }

                    ·

                    ${
                      (token.batches || []).length
                    }

                    batches
                  </div>

                </div>

                ${
                  token.active
                    ? `
                      <button
                        class="btn-del"
                        data-rev="${esc(
                          token.id
                        )}"
                      >
                        Revoke
                      </button>
                    `
                    : ''
                }

              </div>
            `;

          }).join('')

        : `
          <div class="note">
            No tokens yet.
          </div>
        `;


      document.getElementById(
        'batches'
      ).innerHTML = batches.length

        ? batches.map(function(batch) {

            return `
              <div class="item">

                <div>

                  <div class="name">
                    ${esc(batchName(batch))}
                  </div>

                  <div class="sub">
                    Status:
                    ${esc(batchStatus(batch))}
                  </div>

                </div>

                <button
                  class="btn-del"
                  data-delb="${esc(
                    batchId(batch)
                  )}"
                >
                  Delete
                </button>

              </div>
            `;

          }).join('')

        : `
          <div class="note">
            No batches yet.
          </div>
        `;


      document
        .querySelectorAll('[data-rev]')
        .forEach(function(button) {

          button.onclick =
            async function() {

              if (
                !confirm(
                  'Revoke this token?'
                )
              ) {
                return;
              }


              try {

                await api(
                  '/api/admin/uploader-tokens/' +
                  button.dataset.rev,
                  'DELETE'
                );

                refresh();

              } catch (e) {

                alert(e.message);

              }

            };

        });


      document
        .querySelectorAll('[data-delb]')
        .forEach(function(button) {

          button.onclick =
            async function() {

              if (
                !confirm(
                  'Delete this batch and all its tests?'
                )
              ) {
                return;
              }


              try {

                await api(
                  '/api/admin/batches/' +
                  button.dataset.delb,
                  'DELETE'
                );

                refresh();

              } catch (e) {

                alert(e.message);

              }

            };

        });


    } catch (e) {

      document.getElementById(
        'tokens'
      ).innerHTML = `
        <div class="error-box">
          ${esc(e.message)}
        </div>
      `;

    }

  }


  document.getElementById(
    'ba'
  ).onclick = async function() {

    const name =
      document.getElementById(
        'bn'
      ).value.trim();


    bmsg.textContent = '';


    if (!name) {

      bmsg.textContent =
        'Enter a batch name.';

      return;
    }


    try {

      await api(
        '/api/admin/batches',
        'POST',
        {
          name: name,
          status:
            document.getElementById(
              'bs'
            ).value
        }
      );


      document.getElementById(
        'bn'
      ).value = '';


      bmsg.textContent =
        'Batch added.';


      refresh();

    } catch (e) {

      bmsg.textContent =
        e.message;

    }

  };


  document.getElementById(
    'tc'
  ).onclick = async function() {

    const name =
      document.getElementById(
        'tn'
      ).value.trim();


    const ids =
      Array.from(
        document.querySelectorAll(
          '#checks input:checked'
        )
      ).map(function(input) {
        return input.value;
      });


    tmsg.textContent = '';

    document.getElementById(
      'tbox'
    ).innerHTML = '';


    if (!name) {

      tmsg.textContent =
        'Enter a token name.';

      return;
    }


    if (!ids.length) {

      tmsg.textContent =
        'Select at least one batch.';

      return;
    }


    try {

      const data =
        await api(
          '/api/admin/uploader-tokens',
          'POST',
          {
            name: name,
            batchIds: ids
          }
        );


      document.getElementById(
        'tn'
      ).value = '';


      tmsg.textContent =
        'Token created. Copy it now.';


      document.getElementById(
        'tbox'
      ).innerHTML = `
        <div class="tokenbox">
          ${esc(data.token)}
        </div>
      `;


      refresh();

    } catch (e) {

      tmsg.textContent =
        e.message;

    }

  };


  refresh();

}


/* =========================================================
   START
========================================================= */

(function() {

  if (getToken()) {

    showHome();

  } else {

    showLogin();

  }

})();
</script>
