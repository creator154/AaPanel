<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Batch Uploader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Roboto, Arial, sans-serif;
      background: #f7f8fa;
      color: #171717;
    }

    .login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid #e7e7e7;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.07);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }

    .brand p {
      margin: 7px 0 0;
      color: #737373;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: #404040;
    }

    .field input,
    .field select {
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid #d8d8d8;
      border-radius: 7px;
      outline: none;
      background: #fff;
      color: #171717;
      font-size: 14px;
    }

    .field input:focus,
    .field select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.09);
    }

    .field select {
      cursor: pointer;
    }

    #login-error {
      min-height: 18px;
      margin: 0 0 12px;
      color: #dc2626;
      font-size: 13px;
    }

    #login-button {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 7px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
    }

    #login-button:hover {
      background: #1d4ed8;
    }

    #login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      color: #9ca3af;
      font-size: 12px;
    }

    #app {
      display: none;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 25px 21px;
      }
    }
  </style>
</head>

<body>

  <div class="login-screen">

    <div class="login-card">

      <div class="brand">

        <div class="brand-icon">
          Z
        </div>

        <h1>Batch Uploader</h1>

        <p>Sign in to manage your batches</p>

      </div>

      <form id="login-form">

        <div class="field">
          <label for="auth-token">
            Auth Token
          </label>

          <input
            id="auth-token"
            type="password"
            placeholder="Enter auth token"
            autocomplete="off"
            required
          >
        </div>

        <div class="field">
          <label for="role">
            Role
          </label>

          <select id="role">
            <option value="batch">
              Batch Uploader
            </option>
          </select>
        </div>

        <p id="login-error"></p>

        <button
          id="login-button"
          type="submit"
        >
          Login
        </button>

      </form>

      <div class="footer-text">
        Secure uploader panel
      </div>

    </div>

  </div>

  <div id="app"></div>

  <script src="./config.js"></script>
  <script src="./app.js"></script>

</body>
</html>
